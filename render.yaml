services:
  - type: web
    name: metamorphia-db-api
    runtime: python
    plan: free
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.15
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        sync: false
      - key: BD_ACCESS
        sync: false
      - key: IA_API_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: metamorphia-arquivos
      - key: AI_ALLOWED_EMAILS
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: MICROSOFT_CLIENT_ID
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      - key: TWILIO_CONTENT_SID
        sync: false
      - key: STORAGE_DIR
        value: /tmp/metamorphia_storage
      - key: MP_ACCESS_TOKEN
        sync: false
      - key: MP_WEBHOOK_SECRET
        sync: false
      - key: MP_NOTIFICATION_URL
        sync: false
      - key: MP_SUCCESS_URL
        sync: false
      - key: MP_FAILURE_URL
        sync: false
      - key: MP_PENDING_URL
        sync: false
